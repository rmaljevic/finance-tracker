
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Finance Tracker</h1>
            <p>Manage your money in one place.</p>
        </header>

        <!-- Pregled ukupnih finansija -->
        <section class="summary">

            <div class="summary-card">
                <h2>Balance</h2>
                <p id="balance">€0.00</p>
            </div>

            <div class="summary-card">
                <h2>Total Income</h2>
                <p id="income">€0.00</p>
            </div>

            <div class="summary-card">
                <h2>Total Expenses</h2>
                <p id="expenses">€0.00</p>
            </div>

            <div class="summary-card">
                <h2>Transactions</h2>
                <p id="transactionCount">0</p>
            </div>

        </section>


        <!-- Mjesecni pregled finansija -->
        <section class="monthly-section">

            <div class="monthly-header">
                <h2>Monthly Overview</h2>
                <input type="month" id="monthPicker">
            </div>

            <div class="monthly-summary">

                <div class="monthly-card">
                    <h3>Monthly Income</h3>
                    <p id="monthlyIncome">€0.00</p>
                </div>

                <div class="monthly-card">
                    <h3>Monthly Expenses</h3>
                    <p id="monthlyExpenses">€0.00</p>
                </div>

                <div class="monthly-card">
                    <h3>Monthly Balance</h3>
                    <p id="monthlyBalance">€0.00</p>
                </div>

            </div>

            <div class="chart-section">

                <h3>Income vs Expenses</h3>

                <div class="chart-item">
                    <div class="chart-label">
                        <span>Income</span>
                        <span id="incomeChartValue">€0.00</span>
                    </div>

                    <div class="chart-background">
                        <div id="incomeBar" class="chart-bar income-bar"></div>
                    </div>
                </div>

                <div class="chart-item">
                    <div class="chart-label">
                        <span>Expenses</span>
                        <span id="expensesChartValue">€0.00</span>
                    </div>

                    <div class="chart-background">
                        <div id="expensesBar" class="chart-bar expenses-bar"></div>
                    </div>
                </div>

            </div>

        </section>


        <!-- Forma za dodavanje i izmjenu transakcije -->
        <section class="form-section">

            <h2 id="formTitle">Add Transaction</h2>

            <div class="form-fields">

                <input type="text" id="description" placeholder="Description">

                <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01">

                <input type="date" id="date">

                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button id="addButton">Add Transaction</button>
                <button id="cancelEditButton" hidden>Cancel Edit</button>

            </div>

        </section>


        <!-- Lista svih transakcija -->
        <section class="transactions-section">

            <h2>Transactions</h2>

            <div class="filters">

                <input type="text" id="searchInput" placeholder="Search transactions...">

                <select id="filterCategory">
                    <option value="all">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <select id="sortTransactions">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="highest">Highest Amount</option>
                    <option value="lowest">Lowest Amount</option>
                </select>

            </div>

            <ul id="transactionList"></ul>

            <button id="clearButton" class="clear-button">Clear All</button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
